[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wifiant"
version = "0.1.0"
description = "Live antenna lab for your Wi-Fi link - watch signal, keep revisions, compare runs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "textual>=0.80",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
wifiant = "wifiant.cli:main"

[tool.setuptools.packages.find]
include = ["wifiant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 92
target-version = "py310"
